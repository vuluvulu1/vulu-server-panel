# GitHub'da bir release yayımlanınca vulu-panel-v<sürüm>.zip paketini üretip o release'e ekler.
name: Release paketi

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketi oluştur
        run: python tools/build_release.py "$TAG"

      - name: Release'e ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/vulu-panel-*.zip --clobber